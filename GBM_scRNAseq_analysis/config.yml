    R3: "p14_38_MBT298_R4"
    P4: "p16_1_03_Z1-1P"
    R4: "p16_1_04_Z1-2R"
    P5: "p16_1_05_Z2-1P"
    R5: "p16_1_06_Z2-2R"
    P6: "p16_2_16_Z4-1Pm"
    R6: "p16_2_17_Z4-2Rm"
    P7: "p16_2_20_Z6-1Pm"
    R7: "p16_2_21_Z6-2Rm"
